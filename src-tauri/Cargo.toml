[package]
name = "ads-engine"
version = "0.1.0"
description = "Marketing Intelligence Engine - local intelligence platform for marketing research"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ads_engine_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json", "blocking", "stream"] }
scraper = "0.19"
rayon = "1.10"
headless_chrome = "1.0"
trust-dns-resolver = "0.23"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport"] }
csv = "1.3"
regex = "1.10"
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "io-util"] }
futures-util = "0.3"
